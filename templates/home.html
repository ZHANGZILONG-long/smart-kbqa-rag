<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台 · SmartKBQA</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --line: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #f87171;
      --ok: #34d399;
      --input: #0b1220;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 0% 0%, #1e3a8a44, transparent 55%),
        var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: #0b1220aa;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      font-size: 12px;
    }
    button, .btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
    }
    button:hover, .btn:hover { border-color: var(--primary); color: #93c5fd; }
    button.primary {
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      border: 0;
      color: #fff;
      font-weight: 600;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    main {
      max-width: 980px;
      margin: 24px auto 48px;
      padding: 0 20px;
      display: grid;
      gap: 20px;
    }
    .card {
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
    .meta {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px 12px;
      font-size: 14px;
    }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="file"], select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .field { margin-bottom: 12px; flex: 1; min-width: 160px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
    }
    .badge.ready { color: var(--ok); border-color: #065f46; }
    .badge.failed { color: var(--danger); border-color: #7f1d1d; }
    .badge.processing, .badge.pending { color: #fbbf24; border-color: #78350f; }
    .msg { font-size: 13px; margin-top: 10px; color: var(--muted); }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .answer {
      white-space: pre-wrap;
      line-height: 1.6;
      background: var(--input);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      min-height: 80px;
    }
    .sources { margin-top: 12px; font-size: 12px; color: var(--muted); }
    .sources li { margin-bottom: 8px; }
    .danger { color: var(--danger); border-color: #7f1d1d; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">KB</div>SmartKBQA 工作台</div>
    <div class="row">
      <span id="who" class="sub" style="margin:0"></span>
      <button id="logout-btn" type="button">退出登录</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h1>当前用户</h1>
      <dl class="meta" id="user-meta"><dt>加载中…</dt><dd></dd></dl>
    </section>

    <section class="card">
      <h2>上传文档</h2>
      <p class="sub">支持 pdf / docx / txt / md。上传后会自动解析、分块并写入向量库。</p>
      <form id="upload-form">
        <div class="row">
          <div class="field">
            <label for="file">文件</label>
            <input id="file" name="file" type="file" accept=".pdf,.docx,.txt,.md" required />
          </div>
          <div class="field">
            <label for="title">标题（可选）</label>
            <input id="title" name="title" type="text" placeholder="默认用文件名" />
          </div>
          <div class="field">
            <label for="visibility">可见范围</label>
            <select id="visibility" name="visibility">
              <option value="department">部门可见</option>
              <option value="public">全员可见</option>
            </select>
          </div>
        </div>
        <button class="primary" id="upload-btn" type="submit">上传并处理</button>
        <p id="upload-msg" class="msg"></p>
      </form>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">我的文档</h2>
        <button type="button" id="refresh-docs">刷新</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>标题</th><th>类型</th><th>范围</th><th>状态</th><th>分块</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="doc-tbody">
            <tr><td colspan="7">加载中…</td></tr>
          </tbody>
        </table>
      </div>
      <p id="doc-msg" class="msg"></p>
    </section>

    <section class="card">
      <h2>知识库问答</h2>
      <p class="sub">按你的部门权限检索向量库，再用 DeepSeek（若已配置）生成回答。</p>
      <div class="field">
        <label for="question">问题</label>
        <textarea id="question" placeholder="例如：这份制度里请假流程是什么？"></textarea>
      </div>
      <button class="primary" id="ask-btn" type="button">提问</button>
      <p id="ask-msg" class="msg"></p>
      <div id="answer" class="answer" style="margin-top:12px">回答会显示在这里</div>
      <ol id="sources" class="sources"></ol>
    </section>
  </main>

  <script>
    const access = localStorage.getItem('access_token');
    const refresh = localStorage.getItem('refresh_token');
    if (!access) window.location.replace('/login/');

    const headersJson = {
      'Authorization': 'Bearer ' + access,
      'Content-Type': 'application/json',
    };
    const headersAuth = { 'Authorization': 'Bearer ' + access };

    function setMsg(el, text, type) {
      el.textContent = text || '';
      el.className = 'msg' + (type ? ' ' + type : '');
    }

    async function api(url, options = {}) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        localStorage.clear();
        window.location.replace('/login/');
        throw new Error('未登录或令牌失效');
      }
      let data = null;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        data = await res.json();
      } else if (res.status !== 204) {
        data = await res.text();
      }
      if (!res.ok) {
        const detail = (data && (data.detail || JSON.stringify(data))) || res.statusText;
        throw new Error(detail);
      }
      return data;
    }

    function renderUser(user) {
      const dept = user.department
        ? `${user.department.name} (${user.department.code})`
        : '未分配';
      document.getElementById('user-meta').innerHTML = `
        <dt>用户名</dt><dd>${user.username || '-'}</dd>
        <dt>邮箱</dt><dd>${user.email || '-'}</dd>
        <dt>部门</dt><dd>${dept}</dd>
        <dt>角色</dt><dd>${user.is_admin ? '管理员' : '普通用户'}</dd>
      `;
      document.getElementById('who').textContent = user.username || '';
    }

    async function loadMe() {
      const user = await api('/api/auth/me/', { headers: headersAuth });
      renderUser(user);
      localStorage.setItem('user_info', JSON.stringify(user));
    }

    function statusBadge(status, label) {
      return `<span class="badge ${status}">${label || status}</span>`;
    }

    async function loadDocs() {
      const tbody = document.getElementById('doc-tbody');
      try {
        const data = await api('/api/documents/', { headers: headersAuth });
        const rows = data.results || [];
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="7">暂无文档，先上传一个试试</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(d => `
          <tr>
            <td>${d.id}</td>
            <td>${escapeHtml(d.title)}</td>
            <td>${d.file_type || '-'}</td>
            <td>${d.visibility_display || d.visibility}</td>
            <td>${statusBadge(d.status, d.status_display)}${d.error_message ? `<div class="msg err">${escapeHtml(d.error_message)}</div>` : ''}</td>
            <td>${d.chunk_count}</td>
            <td class="row">
              <button type="button" data-reprocess="${d.id}">重处理</button>
              <button type="button" class="danger" data-del="${d.id}">删除</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7">${escapeHtml(e.message)}</td></tr>`;
      }
    }

    function escapeHtml(s) {
      return String(s || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('upload-msg');
      const btn = document.getElementById('upload-btn');
      const fileInput = document.getElementById('file');
      if (!fileInput.files[0]) return;
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const title = document.getElementById('title').value.trim();
      if (title) fd.append('title', title);
      fd.append('visibility', document.getElementById('visibility').value);
      btn.disabled = true;
      setMsg(msg, '上传处理中…');
      try {
        const data = await api('/api/documents/', {
          method: 'POST',
          headers: headersAuth,
          body: fd,
        });
        const doc = data.document || {};
        setMsg(msg, `上传成功 #${doc.id}，状态：${doc.status_display || doc.status}`, 'ok');
        fileInput.value = '';
        document.getElementById('title').value = '';
        await loadDocs();
      } catch (err) {
        setMsg(msg, err.message || '上传失败', 'err');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('doc-tbody').addEventListener('click', async (e) => {
      const delId = e.target.getAttribute('data-del');
      const repId = e.target.getAttribute('data-reprocess');
      const msg = document.getElementById('doc-msg');
      try {
        if (delId) {
          if (!confirm('确认删除文档 #' + delId + '？')) return;
          await api('/api/documents/' + delId + '/', {
            method: 'DELETE',
            headers: headersAuth,
          });
          setMsg(msg, '已删除 #' + delId, 'ok');
          await loadDocs();
        }
        if (repId) {
          await api('/api/documents/' + repId + '/reprocess/', {
            method: 'POST',
            headers: headersJson,
            body: '{}',
          });
          setMsg(msg, '已重新处理 #' + repId, 'ok');
          await loadDocs();
        }
      } catch (err) {
        setMsg(msg, err.message || '操作失败', 'err');
      }
    });

    document.getElementById('refresh-docs').addEventListener('click', loadDocs);

    document.getElementById('ask-btn').addEventListener('click', async () => {
      const q = document.getElementById('question').value.trim();
      const msg = document.getElementById('ask-msg');
      const answerEl = document.getElementById('answer');
      const sourcesEl = document.getElementById('sources');
      if (!q) {
        setMsg(msg, '请输入问题', 'err');
        return;
      }
      const btn = document.getElementById('ask-btn');
      btn.disabled = true;
      setMsg(msg, '检索与生成中…');
      answerEl.textContent = '…';
      sourcesEl.innerHTML = '';
      try {
        const data = await api('/api/qa/ask/', {
          method: 'POST',
          headers: headersJson,
          body: JSON.stringify({ question: q, top_k: 5 }),
        });
        answerEl.textContent = data.answer || '';
        const sources = data.sources || [];
        sourcesEl.innerHTML = sources.map((s, i) =>
          `<li>[${i + 1}] 《${escapeHtml(s.title || '')}》 score=${s.score != null ? Number(s.score).toFixed(3) : '-'}<br/>${escapeHtml(s.snippet || '')}</li>`
        ).join('');
        setMsg(msg, `完成，命中 ${data.hit_count || 0} 条片段`, 'ok');
      } catch (err) {
        answerEl.textContent = '';
        setMsg(msg, err.message || '提问失败', 'err');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        if (refresh) {
          await fetch('/api/auth/logout/', {
            method: 'POST',
            headers: headersJson,
            body: JSON.stringify({ refresh }),
          });
        }
      } catch (_) {}
      localStorage.clear();
      window.location.href = '/login/';
    });

    const cached = localStorage.getItem('user_info');
    if (cached) {
      try { renderUser(JSON.parse(cached)); } catch (_) {}
    }
    loadMe().then(loadDocs).catch(err => {
      document.getElementById('user-meta').innerHTML = `<dt>错误</dt><dd>${escapeHtml(err.message)}</dd>`;
    });
  </script>
</body>
</html>
