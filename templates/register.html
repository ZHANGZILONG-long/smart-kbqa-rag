<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · SmartKBQA</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --line: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #f87171;
      --ok: #34d399;
      --input: #0b1220;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a8a55, transparent 60%),
        radial-gradient(900px 500px at 100% 0%, #0ea5e955, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo {
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      font-weight: 700; font-size: 14px;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #3b82f633;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary), #0ea5e9);
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .msg { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: var(--danger); }
    .msg.ok { color: var(--ok); }
    .switch {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .switch a { color: #93c5fd; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }
    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">KB</div>
      <h1>注册账号</h1>
    </div>
    <p class="sub">创建普通用户账号，注册成功后自动登录</p>

    <form id="register-form" autocomplete="on">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" required minlength="3" maxlength="150" autofocus placeholder="3 位以上，字母数字等" />
      </div>
      <div class="field">
        <label for="email">邮箱（可选）</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" />
      </div>
      <div class="field">
        <label for="department">部门（可选）</label>
        <select id="department" name="department">
          <option value="">暂不选择</option>
        </select>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="至少 8 位" />
      </div>
      <div class="field">
        <label for="password_confirm">确认密码</label>
        <input id="password_confirm" name="password_confirm" type="password" required minlength="8" placeholder="再输入一次" />
      </div>
      <button id="submit-btn" type="submit">注册并登录</button>
      <p id="msg" class="msg" aria-live="polite"></p>
    </form>

    <p class="hint">注册用户默认为普通成员，不能自提管理员权限。部门用于文档可见范围。</p>
    <div class="switch">已有账号？ <a href="/login/">去登录</a></div>
  </main>

  <script>
    if (localStorage.getItem('access_token')) {
      window.location.replace('/home/');
    }

    const form = document.getElementById('register-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');
    const deptSelect = document.getElementById('department');

    function formatErrors(data) {
      if (!data || typeof data !== 'object') return '注册失败';
      if (data.detail) return String(data.detail);
      const parts = [];
      for (const [k, v] of Object.entries(data)) {
        if (Array.isArray(v)) parts.push(`${k}: ${v.join('；')}`);
        else if (typeof v === 'string') parts.push(`${k}: ${v}`);
        else parts.push(`${k}: ${JSON.stringify(v)}`);
      }
      return parts.join('；') || '注册失败';
    }

    async function loadDepartments() {
      try {
        const res = await fetch('/api/auth/departments/');
        const data = await res.json();
        const rows = data.results || [];
        for (const d of rows) {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `${d.name} (${d.code})`;
          deptSelect.appendChild(opt);
        }
      } catch (_) {
        // 部门加载失败不阻断注册
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.classList.remove('ok');
      btn.disabled = true;
      btn.textContent = '注册中…';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password_confirm = document.getElementById('password_confirm').value;
      const departmentRaw = deptSelect.value;
      const body = { username, password, password_confirm, email };
      if (departmentRaw) body.department_id = Number(departmentRaw);

      try {
        const res = await fetch('/api/auth/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(formatErrors(data));

        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        if (data.user) localStorage.setItem('user_info', JSON.stringify(data.user));

        msg.classList.add('ok');
        msg.textContent = '注册成功，正在进入工作台…';
        window.location.href = '/home/';
      } catch (err) {
        msg.textContent = err.message || '注册失败，请稍后重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '注册并登录';
      }
    });

    loadDepartments();
  </script>
</body>
</html>
