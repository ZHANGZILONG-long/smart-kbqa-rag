# HTTP 入口（本地 / 内网）。生产请在 443 启用下方 HTTPS server 并放入证书。
upstream smartkbqa_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }
    location /media/ {
        alias /var/www/media/;
        expires 1d;
    }

    location /api/ {
        proxy_pass http://smartkbqa_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://smartkbqa_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

