name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django 单元测试
    runs-on: ubuntu-latest

    # 测试所需的最小配置：内存 SQLite + LocMem 缓存，不需要 MySQL/Redis，
    # 也不下载 embedding 模型（用例已 mock 向量检索与 LLM 调用）。
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      USE_SQLITE: "True"
      USE_LOCMEM_CACHE: "True"
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMBEDDING_PROVIDER: hash
      CHROMA_MODE: persistent
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 mysqlclient 所需的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev build-essential pkg-config

      - name: 升级 pip
        run: python -m pip install --upgrade pip

      - name: 安装 CPU 版 torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 安装项目依赖
        run: pip install -r requirements.txt

      - name: 检查迁移文件是否与模型一致
        run: python manage.py makemigrations --check --dry-run

      - name: 运行测试
        run: python manage.py test accounts documents qa common -v 2
